version: "3"

# Set Database Tasks - Taskfile Module
# Included from main Taskfile.yaml
# Pipeline: UESP wiki -> data/sets/*.json. See docs/SET_DATABASE_PLAN.md

vars:
  SETDB: uv run --group setdb python -m tools.setdb

tasks:
  fetch:
    desc: Download/refresh cached UESP set pages (incremental, network)
    cmds:
      - "{{.SETDB}} fetch"
    preconditions:
      - sh: command -v uv
        msg: "uv is not installed. See https://github.com/astral-sh/uv"

  import:
    desc: "Import the in-game dump (/cm sets:dump + /reloadui) from SavedVariables. Optional: -- <path>"
    cmds:
      - "{{.SETDB}} import {{.CLI_ARGS}}"

  parse:
    desc: Parse cached pages into data/sets/*.json (offline)
    cmds:
      - "{{.SETDB}} parse"

  validate:
    desc: Validate data/sets/*.json against the schema (offline)
    cmds:
      - "{{.SETDB}} validate"

  test:
    desc: Run set DB tests (normalizer grammar, SavedVariables reader, reconciliation)
    cmds:
      - uv run --group setdb python -m unittest tools.setdb.test_normalize tools.setdb.test_reconcile tools.setdb.test_digest

  digest:
    desc: "Write the compact LLM digest data/sets/llm_digest.jsonl. Options: -- --types trial,dungeon --no-text --out <path>"
    cmds:
      - "{{.SETDB}} digest {{.CLI_ARGS}}"

  build:
    desc: Parse + validate + digest (offline; run setdb:fetch first to refresh)
    cmds:
      - "{{.SETDB}} build"

  refresh:
    desc: Fetch, parse and validate in one go
    cmds:
      - task: fetch
      - task: build
