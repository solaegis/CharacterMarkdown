name: Release CharacterMarkdown

on:
  push:
    tags:
      - 'v*'

env:
  ADDON_NAME: CharacterMarkdown
  ESOUI_ADDON_ID: '4279'
  ESO_API_VERSION: '12.0.0'
  LUA_VERSION: "5.1"
  BUILD_DIR: "/tmp/CharacterMarkdown"
  # Optional: Set to update API version automatically (e.g., 101047)
  # UPDATE_API_VERSION: ""

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish
    runs-on: ubuntu-latest
    
    steps:
      # ========================================================================
      # 1. Checkout Repository
      # ========================================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for changelog extraction

      # ========================================================================
      # 2. Extract Version from Git Tag and Generate Addon Name
      # ========================================================================
      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"

      - name: Update API version and generate addon name
        id: addon_name
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          if [ -z "$VERSION" ]; then
            echo "❌ VERSION missing from steps.version.outputs"
            exit 1
          fi

          # Read primary API version from manifest (first token after APIVersion:)
          API_VERSION=$(grep "^## APIVersion:" ${{ env.ADDON_NAME }}.txt | awk '{print $3}')
          echo "📋 Current API Version in manifest: $API_VERSION"
          
          # Check if we should update API version automatically
          if [ -n "${{ env.UPDATE_API_VERSION }}" ]; then
            echo "🔄 Auto-updating API version to: ${{ env.UPDATE_API_VERSION }}"
            sed -i "s/^## APIVersion: .*/## APIVersion: ${{ env.UPDATE_API_VERSION }}/g" ${{ env.ADDON_NAME }}.txt
            API_VERSION="${{ env.UPDATE_API_VERSION }}"
            echo "✅ API version updated to: $API_VERSION"
          else
            echo ""
            echo "🔍 API Version Check:"
            echo "   Current in manifest: $API_VERSION"
            echo "   Primary target: 101050 (Update 50)"
            echo ""
            echo "📝 To update API version before release:"
            echo "   1. Run in ESO: /script d(GetAPIVersion())"
            echo "   2. Use helper script: ./scripts/update-api-version.sh [VERSION]"
            echo "   3. Or set UPDATE_API_VERSION environment variable in workflow"
            echo ""
            
            # Validate API version is reasonable (basic sanity check)
            if [ "$API_VERSION" -lt 101000 ]; then
              echo "⚠️  WARNING: API version $API_VERSION seems outdated"
              echo "   Consider updating to current ESO API version"
            elif [ "$API_VERSION" -ge 101050 ]; then
              echo "✅ API version $API_VERSION appears current for Update 50"
            elif [ "$API_VERSION" -ge 101047 ]; then
              echo "✅ API version $API_VERSION appears current for Gold Road / Update 49+"
            else
              echo "ℹ️  API version $API_VERSION may need updating for latest ESO release"
            fi
          fi
          
          # Update version in README_ESOUI.txt
          echo "🔄 Updating version in README_ESOUI.txt to: $VERSION"
          sed -i "s/^CharacterMarkdown v[0-9]\+\.[0-9]\+\.[0-9]\+/CharacterMarkdown v$VERSION/g" README_ESOUI.txt
          sed -i "s/^v[0-9]\+\.[0-9]\+\.[0-9]\+ - .*/v$VERSION - Release $VERSION/g" README_ESOUI.txt
          echo "✅ README_ESOUI.txt version updated"
          
          # Map API version to client release name (using >= logic for current/future releases)
          if [ "$API_VERSION" -ge 101050 ]; then
            CLIENT_RELEASE="Update 50"
          elif [ "$API_VERSION" -ge 101047 ]; then
            CLIENT_RELEASE="Gold Road"
          elif [ "$API_VERSION" -ge 101040 ]; then
            CLIENT_RELEASE="Necrom"
          elif [ "$API_VERSION" -ge 101030 ]; then
            CLIENT_RELEASE="High Isle"
          elif [ "$API_VERSION" -ge 101020 ]; then
            CLIENT_RELEASE="Blackwood"
          elif [ "$API_VERSION" -ge 101010 ]; then
            CLIENT_RELEASE="Greymoor"
          elif [ "$API_VERSION" -ge 101000 ]; then
            CLIENT_RELEASE="Elsweyr"
          else
            # Fallback: use API version if no mapping found
            CLIENT_RELEASE="API-$API_VERSION"
            echo "⚠️  No client release mapping found for API version $API_VERSION"
          fi
          
          # Generate addon name following ESOUI best practices
          FULL_ADDON_NAME="${{ env.ADDON_NAME }} - Updated for $CLIENT_RELEASE"
          
          echo "ADDON_NAME=$FULL_ADDON_NAME" >> $GITHUB_OUTPUT
          echo "ZIP_NAME=$FULL_ADDON_NAME-${VERSION}.zip" >> $GITHUB_OUTPUT
          echo "CLIENT_RELEASE=$CLIENT_RELEASE" >> $GITHUB_OUTPUT
          echo "📦 Addon Name: $FULL_ADDON_NAME"
          echo "📦 ZIP Name: $FULL_ADDON_NAME-${VERSION}.zip"
          echo "📦 Client Release: $CLIENT_RELEASE"

      # ========================================================================
      # 3. Setup Lua Environment (LuaJIT for Lua 5.1 compatibility)
      # ========================================================================
      - name: Setup LuaJIT
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: ${{ env.LUA_VERSION }}

      - name: Setup LuaRocks
        uses: leafo/gh-actions-luarocks@v4

      - name: Install Luacheck
        run: luarocks install luacheck

      # ========================================================================
      # 4. Run Tests
      # ========================================================================
      - name: Run Luacheck
        run: |
          echo "🔍 Running Luacheck..."
          luacheck src/ --exclude-files "*.backup" --ignore 212 || true

      - name: Validate manifest
        run: |
          echo "✅ Validating manifest..."
          lua scripts/validate-manifest.lua ${{ env.ADDON_NAME }}.txt

      # ========================================================================
      # 5. Update Version Placeholders (General Approach)
      # ========================================================================
      - name: Replace version placeholders
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          DATE_VERSION=$(date +'%Y%m%d')
          
          echo "📝 Replacing @project-version@ placeholders everywhere"
          chmod +x scripts/replace-version.sh
          ./scripts/replace-version.sh . "$VERSION"
          
          echo "📝 Updating AddOnVersion in manifest"
          sed -i "s/^## AddOnVersion: .*/## AddOnVersion: $DATE_VERSION/g" ${{ env.ADDON_NAME }}.txt
          
          echo "✅ Version updates complete:"
          echo "   @project-version@ → $VERSION (in all files)"
          echo "   AddOnVersion → $DATE_VERSION (in manifest)"

      # ========================================================================
      # 6. Create Release ZIP
      # ========================================================================
      - name: Create release ZIP
        run: |
          echo "📦 Building release package..."
          
          VERSION="${{ steps.version.outputs.VERSION }}"
          BUILD_DIR="${{ env.BUILD_DIR }}"
          # Whitelist copy into CharacterMarkdown/ (parity with local task build)
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"
          chmod +x scripts/build-copy.sh scripts/replace-version.sh
          ./scripts/build-copy.sh . "$BUILD_DIR"
          ./scripts/replace-version.sh "$BUILD_DIR" "$VERSION"
          
          if [ -f "$BUILD_DIR/pyproject.toml" ] || [ -f "$BUILD_DIR/book.toml" ]; then
            echo "❌ Build package still contains disallowed .toml files"
            find "$BUILD_DIR" -name '*.toml' -print
            exit 1
          fi
          
          if [ ! -f "$BUILD_DIR/${{ env.ADDON_NAME }}.txt" ]; then
            echo "❌ Missing PC manifest: ${{ env.ADDON_NAME }}.txt"
            exit 1
          fi
          if [ -f "$BUILD_DIR/${{ env.ADDON_NAME }}.addon" ]; then
            echo "❌ Unexpected .addon manifest in PC package"
            exit 1
          fi
          
          # Create ZIP from parent of BUILD_DIR (/tmp) so root is CharacterMarkdown/
          cd "$(dirname "$BUILD_DIR")"
          zip -r -q "$GITHUB_WORKSPACE/${{ steps.addon_name.outputs.ZIP_NAME }}" "${{ env.ADDON_NAME }}"
          
          echo "✅ Created: ${{ steps.addon_name.outputs.ZIP_NAME }}"
          
          # Verify ZIP structure
          echo "📋 ZIP contents:"
          unzip -l "$GITHUB_WORKSPACE/${{ steps.addon_name.outputs.ZIP_NAME }}" | head -20

      - name: Validate ZIP structure
        run: |
          bash scripts/validate-zip.sh "${{ steps.addon_name.outputs.ZIP_NAME }}"

      # ========================================================================
      # 7. Extract Changelog for Release Notes
      # ========================================================================
      - name: Extract changelog
        run: |
          echo "📝 Extracting changelog for v${{ steps.version.outputs.VERSION }}"
          
          # Extract the latest version section from CHANGELOG.md
          awk '
            /^## \['"${{ steps.version.outputs.VERSION }}"'\]/ { found=1; print; next }
            /^## \[/ { if (found) exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          
          # Fallback if extraction failed
          if [ ! -s release_notes.md ]; then
            echo "## ${{ steps.addon_name.outputs.ADDON_NAME }} v${{ steps.version.outputs.VERSION }}" > release_notes.md
            echo "" >> release_notes.md
            echo "See [CHANGELOG.md](CHANGELOG.md) for full release notes." >> release_notes.md
          fi
          
          echo "📋 Release notes:"
          cat release_notes.md

      # ========================================================================
      # 8. Create GitHub Release
      # ========================================================================
      - name: Delete existing release if it exists
        run: |
          # Delete existing release if it exists (handles re-runs)
          gh release delete "v${{ steps.version.outputs.VERSION }}" --yes 2>/dev/null || echo "No existing release to delete"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          name: "${{ steps.addon_name.outputs.ADDON_NAME }} v${{ steps.version.outputs.VERSION }}"
          tag: "v${{ steps.version.outputs.VERSION }}"
          artifacts: "${{ steps.addon_name.outputs.ZIP_NAME }}"
          artifactContentType: application/zip
          bodyFile: release_notes.md
          allowUpdates: true
          makeLatest: true
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

      # ========================================================================
      # 9. Upload to ESOUI (PRODUCTION READY)
      # ========================================================================
      # ESOUI API field is "compatible", not "compatibility" (m00nyONE/esoui-upload@v2 sends the wrong name).
      - name: Upload to ESOUI
        env:
          ESOUI_API_KEY: ${{ secrets.ESOUI_API_KEY }}
        run: |
          chmod +x scripts/esoui-upload.sh
          scripts/esoui-upload.sh \
            "$ESOUI_API_KEY" \
            "${{ env.ESOUI_ADDON_ID }}" \
            "${{ steps.version.outputs.VERSION }}" \
            "${{ steps.addon_name.outputs.ZIP_NAME }}" \
            "${{ env.ESO_API_VERSION }}" \
            "CHANGELOG.md" \
            "README_ESOUI.txt"

      # ========================================================================
      # 10. Success Notification
      # ========================================================================
      - name: Release summary
        if: success()
        run: |
          echo "🎉 Release v${{ steps.version.outputs.VERSION }} complete!"
          echo ""
          echo "📦 Addon: ${{ steps.addon_name.outputs.ADDON_NAME }}"
          echo "📦 Client Release: ${{ steps.addon_name.outputs.CLIENT_RELEASE }}"
          echo ""
          echo "✅ GitHub Release: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.VERSION }}"
          echo "✅ ESOUI Upload: Submitted (check https://www.esoui.com/downloads/author.php)"
          echo ""
          echo "📦 Artifacts:"
          echo "   - ${{ steps.addon_name.outputs.ZIP_NAME }}"
          echo ""
          echo "🔗 Next steps:"
          echo "   1. Verify GitHub release looks correct"
          echo "   2. Check ESOUI for successful upload"
          echo "   3. Test addon in-game after approval"
